name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache verified tool downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads
          key: windows-x64-toolchain-${{ hashFiles('scripts/toolchain.lock.json') }}
      - name: Prepare pinned local toolchain
        shell: pwsh
        run: ./scripts/Bootstrap.ps1
      - name: Build and run tests
        shell: pwsh
        run: ./build.ps1 -Test
      # Desktop smoke and visual checks require an interactive Windows desktop.
